name: Refresh company list

on:
  schedule:
    # Twice a month - the 1st and the 15th at 06:00 UTC. This just grows the
    # list (adds newly-appeared companies from the source datasets); it never
    # removes anything or touches data/state.json.
    - cron: "0 6 1,15 * *"
  workflow_dispatch: {}   # trigger manually from the Actions tab any time

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Check out the latest main, not the commit that triggered the run.
          # checkout defaults to the triggering SHA, so a run that waited in
          # the concurrency queue started from the *previous* state.json,
          # re-sent every alert the run ahead of it had just sent, then failed
          # its push on a state-file conflict. Happened 2026-09-11 with two
          # manual triggers 15s apart; a late scheduled run can do the same.
          ref: main

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Refresh company list
        run: python3 refresh_companies.py

      - name: Commit if anything changed
        run: |
          git config user.name "job-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/companies.json
          git diff --quiet --cached || git commit -m "Refresh company list [skip ci]"
          # Both workflows commit to main, so a push can be rejected as
          # non-fast-forward. Without a rebase-and-retry the job just fails and
          # this run's state is thrown away - which makes the NEXT run re-report
          # every posting it already saw. Retry a few times before giving up.
          for i in 1 2 3; do
            git push && exit 0
            echo "push rejected (attempt $i) - rebasing onto latest main"
            # On a conflict, abort instead of leaving git stuck mid-rebase -
            # every later attempt then fails with "unmerged files" and the
            # log hides the real cause.
            git pull --rebase --autostash origin main || git rebase --abort || true
          done
          git push
