name: Check job boards

on:
  schedule:
    # Twice an hour, at :07 and :37. Offset from :00 because GitHub's scheduler
    # explicitly warns that runs are most likely to be dropped at the top of the
    # hour - and "dropped" is literal: GitHub treats schedules as best effort and
    # silently skips them under load rather than queueing. On this repo's first
    # day only 1 of 8 expected hourly runs actually fired, so the second slot is
    # a deliberate second chance at each hour.
    #
    # A skipped run costs nothing but latency: state.json is a diff, so whenever
    # the next run does fire it reports everything new since the last successful
    # run. Nothing is ever lost, it just arrives later.
    #
    # At ~45s per run this is ~1,440 billable minutes/month - still inside a
    # private repo's free 2,000. Drop back to "7 * * * *" if you want it quieter.
    - cron: "7,37 * * * *"
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

# Needed so the workflow can commit the updated state/results files back to the repo.
permissions:
  contents: write

concurrency:
  group: check-jobs
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run checker
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python3 checker.py

      - name: Commit updated state and results
        run: |
          git config user.name "job-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/state.json results/latest.json results/history.jsonl
          git diff --quiet --cached || git commit -m "Update job tracker state [skip ci]"
          # Both workflows commit to main, so a push can be rejected as
          # non-fast-forward. Without a rebase-and-retry the job just fails and
          # this run's state is thrown away - which makes the NEXT run re-report
          # every posting it already saw. Retry a few times before giving up.
          for i in 1 2 3; do
            git push && exit 0
            echo "push rejected (attempt $i) - rebasing onto latest main"
            git pull --rebase --autostash origin main || true
          done
          git push
